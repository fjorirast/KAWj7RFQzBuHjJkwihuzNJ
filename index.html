/* ---------------- 永続ストレージ（localStorage） ---------------- */
const memStore = {};
const store = {
  async get(key) {
    try {
      return localStorage.getItem(key);
    } catch (_) {
      return memStore[key] ?? null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (_) {
      memStore[key] = value;
    }
  }
};
const SKEY = "mountcheck:v2";

/* ---------------- 共有コード（2bit/件 → base64url） ---------------- */
function encodeState(unlocked, owned) {
  const bits = [];
  ALL_KEYS.forEach(k => {
    bits.push(unlocked[k] ? 1 : 0);
    bits.push(owned[k] ? 1 : 0);
  });
  const bytes = [];
  for (let i = 0; i < bits.length; i += 8) {
    let b = 0;
    for (let j = 0; j < 8; j++) b = b << 1 | (bits[i + j] || 0);
    bytes.push(b);
  }
  let bin = "";
  bytes.forEach(b => {
    bin += String.fromCharCode(b);
  });
  const b64 = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return "v1." + b64;
}
function decodeState(code) {
  const raw = String(code).trim().replace(/.*v1\./s, "");
  let b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const bin = atob(b64);
  const bits = [];
  for (let i = 0; i < bin.length; i++) {
    const b = bin.charCodeAt(i);
    for (let j = 7; j >= 0; j--) bits.push(b >> j & 1);
  }
  const unlocked = {},
    owned = {};
  ALL_KEYS.forEach((k, idx) => {
    unlocked[k] = !!bits[idx * 2];
    owned[k] = !!bits[idx * 2 + 1];
  });
  return {
    unlocked,
    owned
  };
}

/* URLハッシュに状態を載せる（共有・復元用） */
function readHashState() {
  try {
    const h = (typeof location !== "undefined" ? location.hash : "").replace(/^#/, "");
    if (!h) return null;
    const m = h.match(/(?:^|[?&])s=([^&]+)/);
    const code = m ? decodeURIComponent(m[1]) : h;
    if (!/v1\./.test(code)) return null;
    return decodeState(code);
  } catch (_) {
    return null;
  }
}
function writeHashState(u, o) {
  try {
    const code = encodeState(u, o);
    const url = location.pathname + location.search + "#s=" + code;
    history.replaceState(null, "", url);
  } catch (_) {}
}
function shareUrl(u, o) {
  try {
    return location.origin + location.pathname + location.search + "#s=" + encodeState(u, o);
  } catch (_) {
    return "#s=" + encodeState(u, o);
  }
}

/* ============================================================ */
function App() {
  const [unlocked, setUnlocked] = useState({});
  const [owned, setOwned] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("normal"); // normal | shot
  const [kindFilter, setKindFilter] = useState("all"); // all | ex | sav
  const [expFilter, setExpFilter] = useState("all"); // all | 新生 | 蒼天 | ...
  const [showSettings, setShowSettings] = useState(false);
  const [shareCode, setShareCode] = useState("");
  const [importCode, setImportCode] = useState("");
  const [copied, setCopied] = useState(false);
  const [copyMsg, setCopyMsg] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const shareRef = useRef(null);

  /* 読み込み：URL（共有リンク）が最優先、無ければ保存データ */
  useEffect(() => {
    (async () => {
      const fromHash = readHashState();
      if (fromHash) {
        setUnlocked(fromHash.unlocked);
        setOwned(fromHash.owned);
        stateRef.current = fromHash;
        writeNow(fromHash.unlocked, fromHash.owned); // 端末にも保存
        setLoaded(true);
        return;
      }
      const raw = await store.get(SKEY);
      if (raw) {
        try {
          const d = JSON.parse(raw);
          setUnlocked(d.unlocked || {});
          setOwned(d.owned || {});
          stateRef.current = {
            unlocked: d.unlocked || {},
            owned: d.owned || {}
          };
          writeHashState(d.unlocked || {}, d.owned || {}); // URLにも反映
        } catch (_) {}
      }
      setLoaded(true);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* 保存：書き込みはまとめて行う（連打でブリッジ呼び出しが詰まらないように） */
  const stateRef = useRef({
    unlocked: {},
    owned: {}
  });
  const writeTimer = useRef(null);
  const writeNow = useCallback((u, o) => {
    store.set(SKEY, JSON.stringify({
      unlocked: u,
      owned: o,
      savedAt: Date.now()
    }));
    writeHashState(u, o);
  }, []);
  const flushNow = useCallback(() => {
    if (writeTimer.current) {
      clearTimeout(writeTimer.current);
      writeTimer.current = null;
    }
    writeNow(stateRef.current.unlocked, stateRef.current.owned);
  }, [writeNow]);
  const persist = useCallback((u, o) => {
    stateRef.current = {
      unlocked: u,
      owned: o
    };
    if (writeTimer.current) clearTimeout(writeTimer.current);
    writeTimer.current = setTimeout(() => {
      writeTimer.current = null;
      writeNow(u, o);
    }, 500);
  }, [writeNow]);

  /* 離脱・非表示時に確実に書き込む */
  useEffect(() => {
    const onHide = () => {
      if (document.visibilityState === "hidden") flushNow();
    };
    document.addEventListener("visibilitychange", onHide);
    window.addEventListener("pagehide", flushNow);
    return () => {
      document.removeEventListener("visibilitychange", onHide);
      window.removeEventListener("pagehide", flushNow);
      flushNow();
    };
  }, [flushNow]);

  /* 取得トグル：ONにしたら解放も自動ON */
  const toggleOwned = key => {
    const nextOwned = {
      ...owned,
      [key]: !owned[key]
    };
    const nextUnlocked = {
      ...unlocked
    };
    if (nextOwned[key]) nextUnlocked[key] = true;
    setOwned(nextOwned);
    setUnlocked(nextUnlocked);
    persist(nextUnlocked, nextOwned);
  };
  /* 解放トグル：OFFにしたら取得も自動OFF */
  const toggleUnlocked = key => {
    const nextUnlocked = {
      ...unlocked,
      [key]: !unlocked[key]
    };
    const nextOwned = {
      ...owned

function hexA(hex, a) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}
