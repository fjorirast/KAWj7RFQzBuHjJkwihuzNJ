/* ---------------- 永続ストレージ（localStorage） ---------------- */
const memStore = {};
const store = {
  async get(key) {
    try {
      return localStorage.getItem(key);
    } catch (_) {
      return memStore[key] ?? null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (_) {
      memStore[key] = value;
    }
  }
};
const SKEY = "mountcheck:v2";
const KEY_CUSTOM = "cc:custom"; // ユーザー追加行 { [typeId]: [row,...] }
const KEY_DATA = "cc:data"; // インポートしたデータ { [typeId]: [group,...] }

/* 状態エンコード（2bit/件・URLハッシュ共有用） */
function encodeState(allKeys, unlocked, owned) {
  const bits = [];
  allKeys.forEach(k => {
    bits.push(unlocked[k] ? 1 : 0);
    bits.push(owned[k] ? 1 : 0);
  });
  const bytes = [];
  for (let i = 0; i < bits.length; i += 8) {
    let b = 0;
    for (let j = 0; j < 8; j++) b = b << 1 | (bits[i + j] || 0);
    bytes.push(b);
  }
  let bin = "";
  bytes.forEach(b => {
    bin += String.fromCharCode(b);
  });
  return "v1." + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeState(allKeys, code) {
  const raw = String(code).trim().replace(/.*v1\./s, "");
  let b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const bin = atob(b64);
  const bits = [];
  for (let i = 0; i < bin.length; i++) {
    const b = bin.charCodeAt(i);
    for (let j = 7; j >= 0; j--) bits.push(b >> j & 1);
  }
  const unlocked = {},
    owned = {};
  allKeys.forEach((k, idx) => {
    if (bits[idx * 2]) unlocked[k] = true;
    if (bits[idx * 2 + 1]) owned[k] = true;
  });
  return {
    unlocked,
    owned
  };
}
function readHash() {
  try {
    const h = (typeof location !== "undefined" ? location.hash : "").replace(/^#/, "");
    if (!h) return null;
    const m = h.match(/(?:^|[?&])s=([^&]+)/);
    const code = m ? decodeURIComponent(m[1]) : h;
    return /v1\./.test(code) ? code : null;
  } catch (_) {
    return null;
  }
}
function writeHash(allKeys, u, o) {
  try {
    history.replaceState(null, "", location.pathname + location.search + "#s=" + encodeState(allKeys, u, o));
  } catch (_) {}
}

/* hex+alpha */
function hexA(hex, a) {
  const h = hex.replace("#", "");
  return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`;
}
